<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gamma Event Lab</title>
<style>body{font:16px system-ui;max-width:48rem;margin:3rem auto;padding:0 1rem;background:#101827;color:#e6edf7}textarea{width:100%;height:6rem;box-sizing:border-box}button{padding:.7rem 1rem}pre{white-space:pre-wrap}small{color:#aec3dc}</style></head>
<body><h1>Simulated telescope event screening</h1><p>Explore the classifier with ten numerical shower features. This demo is for education, not real observations.</p>
<p><small>Order: fLength, fWidth, fSize, fConc, fConc1, fAsym, fM3Long, fM3Trans, fAlpha, fDist.</small></p>
<label for="features">Comma-separated features</label><textarea id="features">100,20,2,0.4,0.2,0,0,0,20,100</textarea><button id="send">Evaluate</button><pre id="result" aria-live="polite"></pre>
<script>document.querySelector('#send').onclick=async()=>{const out=document.querySelector('#result');try{const raw=document.querySelector('#features').value.split(',');if(raw.length!==10||raw.some(x=>x.trim()===''||!Number.isFinite(Number(x))))throw Error('Enter exactly ten finite numbers.');const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({features:raw.map(Number)})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}};</script></body></html>
